services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    command: ['postgres', '-c', 'listen_addresses=*', '-c', 'statement_timeout=60000', '-c', 'default_transaction_isolation=REPEATABLE READ', '-c', 'shared_preload_libraries=pg_stat_statements,auto_explain']
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass medplum
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'medplum', 'ping']
    networks:
      - app-network

  medplum-server:
    image: medplum/medplum-server:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '8103:8103'
    environment:
      MEDPLUM_CONFIG: 'env'
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: 'http://medplum.limpora.xyz/api/'
      MEDPLUM_APP_BASE_URL: 'http://medplum.limpora.xyz/'
      MEDPLUM_STORAGE_BASE_URL: 'http://medplum.limpora.xyz/api/storage/'
      MEDPLUM_DATABASE_HOST: 'postgres'
      MEDPLUM_DATABASE_USERNAME: 'medplum'
      MEDPLUM_DATABASE_PASSWORD: 'medplum'
      MEDPLUM_REDIS_HOST: 'redis'
      MEDPLUM_REDIS_PASSWORD: 'medplum'
      MEDPLUM_ALLOWED_ORIGINS: '*' # Allows your backend at www.limpora.xyz to call it
    networks:
      - app-network

  medplum-app:
    image: medplum/medplum-app:latest
    restart: unless-stopped
    environment:
      - MEDPLUM_BASE_URL=http://medplum.limpora.xyz/api/
    ports:
      - '3000:3000'
    networks:
      - app-network

  app-backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - '3333:3333'
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

volumes:
  medplum-postgres-data:

networks:
  app-network:
    driver: bridge