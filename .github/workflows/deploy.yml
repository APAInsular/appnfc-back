name: Deploy Backend (Develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/qvida/appnfc-back
            git reset --hard
            git clean -fd
            git pull origin develop

            cat > .env << 'ENVEOF'
            TZ=UTC
            PORT=${{ vars.PORT }}
            HOST=${{ vars.HOST }}
            NODE_ENV=production

            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            APP_KEY=${{ secrets.APP_KEY }}
            APP_URL=${{ vars.APP_URL }}

            SESSION_DRIVER=cookie

            MEDPLUM_URL=${{ secrets.MEDPLUM_URL }}
            MEDPLUM_CLIENT_ID=${{ secrets.MEDPLUM_CLIENT_ID }}
            MEDPLUM_CLIENT_SECRET=${{ secrets.MEDPLUM_CLIENT_SECRET }}
            MEDPLUM_PROJECT_ID=${{ secrets.MEDPLUM_PROJECT_ID }}

            DB_CONNECTION=postgres
            DB_HOST=postgres
            DB_PORT=5432
            DB_USER=${{ secrets.PG_USER }}
            DB_PASSWORD=${{ secrets.PG_PASSWORD }}
            DB_DATABASE=${{ secrets.PG_DB_NAME }}

            ADMIN_BOOTSTRAP_SECRET=${{ secrets.ADMIN_BOOTSTRAP_SECRET }}

            ENVEOF

            COMPOSE_FILE=/opt/qvida/appnfc-back/infra/docker/docker-compose.yml
            
            docker image prune -f --filter "until=24h"
            docker compose -f $COMPOSE_FILE stop app-backend
            docker compose -f $COMPOSE_FILE rm -f app-backend

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            docker compose -f $COMPOSE_FILE build --progress=plain app-backend
            docker compose -f $COMPOSE_FILE up -d app-backend
